name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/**'
      - 'catalog/**'
      - 'LUCIDE_VERSION.txt'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Keep in step with the ShellDocs.* package versions in ShellIcons.Docs.csproj.
      - name: Install ShellDocs.CLI
        run: dotnet tool install -g ShellDocs.CLI --version 0.1.7-alpha

      # Prerenders every content/ page to static HTML; CNAME ships from wwwroot/.
      - name: Build docs (static)
        working-directory: docs/ShellIcons.Docs
        run: shelldocs build --output ../../publish --spa-fallback --site-url https://shellicons.shellui.dev

      # Jekyll would drop the _framework/ and _content/ folders.
      - name: Disable Jekyll
        run: touch publish/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
