name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # ShellIcons.Blazor targets net8.0 + net9.0, so the tests need both runtimes.
      - name: Install net8 + net9 runtimes
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore
        run: dotnet restore ShellIcons.slnx

      - name: Build
        run: dotnet build ShellIcons.slnx --configuration Release --no-restore
        env:
          ContinuousIntegrationBuild: true

      - name: Test
        run: dotnet test ShellIcons.slnx --configuration Release --no-build --verbosity normal

      # The projects, not the solution: packing the solution warns for every non-packable project.
      - name: Smoke pack
        run: |
          dotnet pack src/ShellIcons.Blazor/ShellIcons.Blazor.csproj --configuration Release --no-build --output nupkgs
          dotnet pack src/ShellIcons.Avalonia/ShellIcons.Avalonia.csproj --configuration Release --no-build --output nupkgs
        env:
          ContinuousIntegrationBuild: true

      - name: List produced packages
        run: ls -la nupkgs/

      # The Avalonia tests render every icon through Skia; keep the images to look at.
      - name: Upload Avalonia renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avalonia-renders-linux
          path: tests/ShellIcons.Avalonia.Tests/bin/Release/net10.0/renders/
          if-no-files-found: ignore

  # The Avalonia package runs on every desktop OS; the Linux run is in build-test above.
  avalonia:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test tests/ShellIcons.Avalonia.Tests --configuration Release --verbosity normal
        env:
          ContinuousIntegrationBuild: true

      - name: Upload Avalonia renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avalonia-renders-${{ matrix.name }}
          path: tests/ShellIcons.Avalonia.Tests/bin/Release/net10.0/renders/
          if-no-files-found: ignore

  # Windows builds every MAUI target (Android, iOS, Mac Catalyst, Windows); ubuntu lacks the workloads.
  maui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Build (all platform targets)
        run: dotnet build ShellIcons.Maui.slnx --configuration Release
        env:
          ContinuousIntegrationBuild: true

      - name: Test
        run: dotnet test tests/ShellIcons.Maui.Tests --configuration Release --no-build --verbosity normal

      - name: Smoke pack
        run: dotnet pack src/ShellIcons.Maui/ShellIcons.Maui.csproj --configuration Release --no-build --output nupkgs
        env:
          ContinuousIntegrationBuild: true
